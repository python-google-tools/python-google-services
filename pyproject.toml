[project]
name = "googlepy"
version = "0.2.0"
description = "Reusable, framework-agnostic Google API service utilities for Python"
requires-python = ">=3.9"
dependencies = [
    "gspread",
    "google-auth",
    "google-auth-oauthlib",
    "pydantic",
    "python-dotenv",
    "requests",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
test = [
    "pytest",
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "ruff",              # formats API-reference signatures (separate_signature)
    "pylint",            # provides `pyreverse` for auto-generated UML
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/googlepy", "src/client", "src/config", "src/sheet"]
