[project]
name = "googlepy"
version = "0.1.0"
description = "Google API Python module"
requires-python = ">=3.9"
dependencies = [
    "gspread",
    "google-auth",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["googlepy"]

