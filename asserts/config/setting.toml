# default.toml — shipped default configuration for googlepy.
#
# These are the built-in defaults. You should not need to edit this file to use
# the library; override any value at runtime instead:
#
#   scopes        →  GOOGLE_SCOPES env var (comma-separated), or pass scopes=
#                    to service_account_provider() / oauth_provider().
#   service key   →  SERVICE_KEY_FILE env var, or pass key_file=.
#   client secret →  CLIENT_SECRET_FILE env var, or pass client_secret_file=.
#
# Resolution order for scopes:
#   explicit arg  >  GOOGLE_SCOPES env  >  this file  >  DEFAULT_SCOPES (in code)

[google]
# OAuth 2.0 / API scopes requested when building credentials.
scopes = [
    "https://www.googleapis.com/auth/spreadsheets",
    "https://www.googleapis.com/auth/drive",
    "https://www.googleapis.com/auth/drive.file",
    "https://www.googleapis.com/auth/drive.readonly",
    "https://www.googleapis.com/auth/drive.metadata.readonly",
    "https://www.googleapis.com/auth/drive.appdata",
    "https://www.googleapis.com/auth/drive.photos.readonly",
]


